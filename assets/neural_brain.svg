  <path d="M286 178c13-26 47-28 62-7 13 19-3 39-22 43-20 5-38-9-40-27m-28 62c15-21 47-15 52 7 3 17-10 30-27 30m80-124c-5 27 11 37 31 34 18-3 25-23 19-39m-31 106c-16-20-45-15-50 7-4 16 9 27 23 29m-5 67c-14-22-39-22-53-5m103-30c-8 23-36 29-54 14m76-109c16-16 41-11 46 9 5 17-10 28-26 27m-17 52c16-16 43-11 49 7"/>
 </g>
