<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" fill="none">
<defs>
 <radialGradient id="aura"><stop stop-color="#55ddcf" stop-opacity=".34"/><stop offset="1" stop-color="#55ddcf" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="250" y1="90" x2="650" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#dbfff2" stop-opacity=".34"/><stop offset=".45" stop-color="#74ddd4" stop-opacity=".19"/><stop offset="1" stop-color="#9b9bec" stop-opacity=".3"/></linearGradient>
 <linearGradient id="rightGlass" x1="500" y1="100" x2="690" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#f3d9e5" stop-opacity=".26"/><stop offset=".5" stop-color="#86a9dc" stop-opacity=".22"/><stop offset="1" stop-color="#ffad9b" stop-opacity=".32"/></linearGradient>
 <linearGradient id="wire"><stop stop-color="#71e1d1"/><stop offset="1" stop-color="#ffad9c"/></linearGradient>
 <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes shimmer{0%,100%{opacity:.72}50%{opacity:1}}
 .brain{transform-origin:460px 310px;animation:drift 9s ease-in-out infinite}
 .orbit{transform-origin:460px 310px;animation:orbit 58s linear infinite}
 .orbit2{transform-origin:460px 310px;animation:orbit 72s linear infinite reverse}
 .node{animation:shimmer 3.6s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){.brain,.orbit,.orbit2,.node{animation:none!important}}
 </style>
</defs>
<ellipse cx="460" cy="310" rx="390" ry="290" fill="url(#aura)" filter="url(#halo)"/>
<g opacity=".52" stroke="#86e9df"><ellipse class="orbit" cx="460" cy="310" rx="360" ry="145" stroke-dasharray="2 12"/><ellipse class="orbit2" cx="460" cy="310" rx="316" ry="210" stroke-dasharray="2 15" stroke="#f7a99d"/></g>
